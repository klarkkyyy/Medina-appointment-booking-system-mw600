<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbershop Appointment Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Barbershop Appointment Book</h1>
    <p>8:00 AM - 7:00 PM</p>
  </header>

  <main>

    <section class="card">
      <h2 id="form-title">Book an Appointment</h2>

      <form id="appointment-form">
        <div class="field">
          <label for="customer_name">Customer name</label>
          <input type="text" id="customer_name" required>
        </div>

        <div class="field">
          <label for="contact_number">Contact number</label>
          <input type="text" id="contact_number" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric" required>
        </div>

        <div class="field">
          <label for="service">Service</label>
          <select id="service" required>
            <option value="">-- Choose a service --</option>
            <option value="Haircut">Haircut</option>
            <option value="Shave">Shave</option>
            <option value="Haircut + Shave">Haircut + Shave</option>
          </select>
        </div>

        <div class="field">
          <label for="appointment_date">Date</label>
          <input type="date" id="appointment_date" required>
        </div>

        <div class="field">
          <label for="appointment_time">Time</label>
          <input type="time" id="appointment_time" required>
        </div>

        <div class="field" id="status-field" hidden>
          <label for="status">Status</label>
          <select id="status">
            <option value="booked">Booked</option>
            <option value="done">Done</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="form-buttons">
          <button type="submit" id="save-button">Book Appointment</button>
          <button type="button" id="cancel-edit-button" class="secondary" hidden>Cancel Edit</button>
        </div>
      </form>

      <p id="message" hidden></p>
    </section>

    <section class="card">
      <h2>Appointments</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Customer</th>
              <th>Contact</th>
              <th>Service</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appointment-rows"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
